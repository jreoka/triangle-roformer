[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triangle-roformer"
version = "0.2.0"
description = "Triangle RoFormer: Linear-complexity Triangle Multiplicative Update Transformer with Relative RoPE for 1D sequences (language, audio) and 2D time-frequency grids."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["pytorch", "transformer", "rope", "triangle-roformer", "roformer", "audio", "language-model"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
